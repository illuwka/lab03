{% extends "base.html" %}
{% block title %}Магазин скінів CS2{% endblock %}
{% block extra_head %}
<style>
  .shop-page { color: #202332; font-family: Arial, sans-serif; }
  .shop-intro { margin-bottom: 26px; }
  .shop-intro h1 { margin: 0 0 8px; font-size: 32px; }
  .shop-intro p { margin: 0; color: #717787; }
  .shop-catalog-title { margin: 22px 0 14px; font-size: 22px; }
  .shop-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .shop-item { overflow: hidden; border: 1px solid #e0e3e9; border-radius: 8px; background: white; }
  .shop-item-image { width: 100%; height: 160px; display: block; object-fit: contain; padding: 12px; background: #eceef2; }
  .shop-item-info { padding: 13px; }
  .shop-weapon { margin-bottom: 4px; color: #717787; font-size: 12px; }
  .shop-skin { font-size: 15px; font-weight: bold; }
  .shop-item-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; }
  .shop-quality { color: #797100; font-size: 12px; }
  .shop-price { font-size: 16px; font-weight: bold; white-space: nowrap; }
  .shop-footer { margin-top: 30px; padding: 20px; border-top: 1px solid #e0e3e9; color: #717787; text-align: center; font-size: 12px; }
  @media (max-width: 850px) { .shop-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 650px) { .shop-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .shop-item-image { height: 130px; } }
  @media (max-width: 380px) { .shop-grid { grid-template-columns: 1fr; } .shop-item-image { height: 170px; } }
</style>
{% endblock %}

  <section class="shop-grid" id="grid"></section>
