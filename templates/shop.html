{% extends "base.html" %}

{% block title %}CS2 Skin Shop{% endblock %}

{% block extra_head %}
<style>
  * { box-sizing: border-box; }
  body.bg-gray-100 { margin: 0; color: #202332; background: #f6f7f9; font-family: Arial, sans-serif; }
  .shop-page { width: 100%; }
  .intro { margin-bottom: 26px; }
  h1 { margin: 0 0 8px; font-size: 32px; font-weight: 700; }
  .intro p { margin: 0; color: #717787; }
  .catalog-head { margin: 22px 0 14px; font-size: 22px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .item { overflow: hidden; border: 1px solid #e0e3e9; border-radius: 8px; background: white; }
  .item-image { display: block; width: 100%; height: 160px; padding: 12px; object-fit: contain; background: #eceef2; }
  .item-info { padding: 13px; }
  .weapon { margin-bottom: 4px; color: #717787; font-size: 12px; }
  .skin { font-size: 15px; font-weight: bold; }
  .item-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; }
  .quality { color: #797100; font-size: 12px; }
  .price { font-size: 16px; font-weight: bold; white-space: nowrap; }
  .shop-footer { margin: 40px -16px -16px; padding: 20px; border-top: 1px solid #e0e3e9; color: #717787; text-align: center; font-size: 12px; }
  @media (max-width: 850px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; } }
  @media (max-width: 650px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .item-image { height: 130px; } }
  @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } .item-image { height: 170px; } }
</style>
{% endblock %}
